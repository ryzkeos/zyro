name: promote develop to main

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: open pr and enable auto merge
        run: |
          ahead=$(gh api "repos/$GH_REPO/compare/main...develop" --jq .ahead_by)
          if [ "$ahead" -eq 0 ]; then
            echo "develop has nothing new for main"
            exit 0
          fi
          pr=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base main --head develop --title "merge develop into main" --body "automated promotion from develop"
          fi
          gh pr merge develop --auto --merge
